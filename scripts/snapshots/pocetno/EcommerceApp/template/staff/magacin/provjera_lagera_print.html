<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="utf-8">
    <title>Manjak i višak — {{ label }}</title>
    <style>
        @page { size: A4 portrait; margin: 12mm; }
        body { font: 13px/1.35 Arial, Helvetica, sans-serif; color: #111; margin: 0; }
        h1 { font-size: 18px; margin: 0 0 4px; }
        .meta { color: #555; margin: 0 0 14px; font-size: 12px; }
        table { width: auto; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #ddd; padding: 5px 10px 5px 0; text-align: left; vertical-align: top; white-space: nowrap; }
        th { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: #555; }
        td.q { font-weight: 700; padding-left: 14px; }
        tr.is-manjak td { background: #fef2f2; }
        tr.is-visak td { background: #fff7ed; }
        .is-manjak { color: #b91c1c; }
        .is-visak { color: #c2410c; }
        @media screen {
            body { padding: 20px; }
            .bar { margin-bottom: 16px; }
            button {
                min-height: 40px;
                padding: 0 14px;
                font: inherit;
                font-weight: 700;
            }
        }
        @media print { .bar { display: none; } }
    </style>
</head>
<body>
    <div class="bar"><button type="button" onclick="window.print()">Štampaj</button></div>
    <h1>Manjak i višak — {{ label }}</h1>
    <p class="meta">
        {% if fajl_naziv %}{{ fajl_naziv }} · {% endif %}
        {{ rows|length }} stavki (samo razlike)
    </p>
    <table>
        <thead>
            <tr>
                <th>Šifra</th>
                <th class="q">Razlika</th>
            </tr>
        </thead>
        <tbody>
            {% for row in rows %}
            <tr class="is-{{ row.status }}">
                <td>{{ row.sifra }}</td>
                <td class="q is-{{ row.status }}">{{ row.status_label }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="2">Nema manjka ni viška za štampu.</td></tr>
            {% endfor %}
        </tbody>
    </table>
    <script>window.addEventListener('load', function () { window.print(); });</script>
</body>
</html>
