<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="60">
  <meta name="robots" content="noindex, nofollow">
  <title>Carpologija.BH — Update u toku</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="maintenance" aria-labelledby="maintenance-title">
    <img class="brand-logo" src="./assets/logo.png" alt="Carpologija.BH — Oprema za ribolov">
    <section class="content">
      <p class="eyebrow">CARPOLOGIJA.BH</p>
      <h1>Sajt je trenutno u <span>update-u</span></h1>
      <p class="intro">Radimo na poboljšanjima kako bismo vam omogućili još bolje iskustvo kupovine.</p>
      <article class="notice" aria-label="Informacija o trajanju update-a">
        <div class="clock" aria-hidden="true"></div>
        <div>
          <p>Sajt će ponovo biti dostupan za oko</p>
          <strong><b>1</b> minut</strong>
        </div>
      </article>
      <div class="loader" role="status" aria-label="Update je u toku"><i></i><i></i><i></i></div>
    </section>
    <footer>
      <strong>Hvala na strpljenju!</strong>
      <span>CARPOLOGIJA.BH — Oprema za ribolov</span>
    </footer>
  </main>
</body>
</html>
