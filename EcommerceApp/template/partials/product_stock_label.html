<p class="product-stock-label{% if product.na_stanju %} product-stock-label--in{% else %} product-stock-label--out{% endif %}">
    <span class="product-stock-label__available">{% if product.na_stanju %}Na stanju{% else %}Nije na stanju{% endif %}</span>
    {% if product.na_stanju and product.stanje > 0 %}<span class="product-stock-label__qty">{{ product.stanje }} kom</span>{% endif %}
</p>
