{% load static %}
<section class="fishing-hero" aria-labelledby="fishingHeroTitle">
    <div class="fishing-hero__content">
        <p class="fishing-hero__eyebrow"><span aria-hidden="true"></span> CARPOLOGIJA BH · OPREMA ZA RIBOLOV</p>
        <h1 id="fishingHeroTitle">Tvoj mir je na vodi.<br><span>Tvoja oprema je ovdje.</span></h1>
        <p class="fishing-hero__description">Od prvog zabačaja do ulova za pamćenje. Pronađi štapove, mašinice, mamce i pribor za svoj sljedeći izlazak na vodu.</p>
        <div class="fishing-hero__actions">
            <a class="fishing-hero__primary" href="#mobileHomeCategories">Istraži opremu <span aria-hidden="true">↗</span></a>
            <a class="fishing-hero__secondary" href="{% url 'home' %}?akcija=1">Pogledaj akcije <span aria-hidden="true">→</span></a>
        </div>
        <div class="fishing-hero__foot"><span>Za svaki stil ribolova.</span><span>Za svaki novi izazov.</span></div>
    </div>
    <div class="fishing-hero__visual"><img class="fishing-hero__image" src="{% static 'img/banners/fishing-hero-jacket-transparent.webp' %}" alt="Ribolovačka jakna s kapuljačom" width="1254" height="1254" fetchpriority="high" decoding="async"></div>
</section>
