{% load static %}
{% if page_obj %}
<div class="catalog-load-more" data-catalog-more data-total="{{ page_obj.paginator.count }}">
    <p data-catalog-progress role="status" aria-live="polite">Prikazano {{ page_obj.end_index }} od {{ page_obj.paginator.count }} artikala</p>
    {% if page_obj.has_next %}
    <button type="button" data-catalog-next="{{ filter_action }}{% if catalog_query %}?{{ catalog_query }}&{% else %}?{% endif %}page={{ page_obj.next_page_number }}">Prikaži još</button>
    {% endif %}
</div>
<link rel="stylesheet" href="{% static 'css/catalog-load-more.css' %}?v=20261014">
<script src="{% static 'js/catalog-load-more.js' %}?v=20261014" defer></script>
{% endif %}
