<button
    type="button"
    class="{{ btn_class|default:'product-card-add-btn product-card-add-btn--notify' }} stock-notify-action"
    data-stock-notify
    style="border:0!important;box-shadow:none!important;outline-color:#008bce!important"
    data-product-id="{{ product.pk }}"
    data-product-name="{{ product.naziv }}"
    data-notify-url="{% url 'stock_notify' product.slug %}"
    aria-label="{{ notify_label|default:'Javi mi' }} — {{ product.naziv }}"
>
    <span data-stock-notify-label><span class="stock-notify-label--desktop">{{ notify_label|default:'Obavjesti me' }}</span><span class="stock-notify-label--mobile">Obavjesti me kada dodje</span></span>
</button>
