{% for item in cart_items %}
<li data-cart-key="{{ item.key }}">
    <span class="checkout-item-label">
        {% include 'partials/cart_item_name.html' with item=item %}
        <span class="cart-item-stock" data-stock-label data-sold-out="{{ item.sold_out|yesno:'true,false' }}" role="status">{% if item.sold_out %}Nije na stanju{% else %}Na stanju{% endif %}</span><a data-stock-remove href="{% url 'cart' %}"{% if not item.sold_out %} hidden{% endif %}>Ukloni iz korpe</a>
        <span class="checkout-item-qty">× {{ item.quantity }}</span>
    </span>
    <span>{{ item.ukupno_stavka }} KM</span>
</li>
{% endfor %}
