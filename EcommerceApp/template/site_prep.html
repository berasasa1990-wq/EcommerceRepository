{% load static %}
<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0a1210">
    <title>Trenutno radimo na poboljšanju — opremazaribolov.ba</title>
    {% if logo_url %}
    <link rel="icon" href="{{ logo_url }}">
    {% endif %}
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            min-height: 100%;
            height: 100%;
            background: #0a1210;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            min-height: 100dvh;
            overflow: hidden;
        }
        .prep-hero {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 42%;
            display: block;
            z-index: 0;
        }
        .prep-staff {
            position: fixed;
            right: max(12px, env(safe-area-inset-right));
            bottom: max(12px, env(safe-area-inset-bottom));
            z-index: 2;
            width: min(280px, calc(100vw - 24px));
            color: #e8ece6;
        }
        .prep-staff summary {
            cursor: pointer;
            list-style: none;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .04em;
            text-transform: uppercase;
            color: rgba(255,255,255,.45);
            text-align: right;
            user-select: none;
        }
        .prep-staff summary::-webkit-details-marker { display: none; }
        .prep-staff summary:hover { color: rgba(255,255,255,.8); }
        .prep-staff[open] {
            background: rgba(8, 12, 10, .82);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 12px;
            padding: 12px;
        }
        .prep-staff[open] summary { margin-bottom: 10px; text-align: left; color: #bbf7d0; }
        .prep-form { display: flex; flex-direction: column; gap: 8px; }
        .prep-form input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 8px;
            background: rgba(255,255,255,.08);
            color: #fff;
            font: inherit;
            font-size: 15px;
        }
        .prep-form input:focus {
            outline: none;
            border-color: #5BB805;
        }
        .prep-error {
            font-size: 13px;
            color: #fecaca;
            background: rgba(127,29,29,.55);
            border-radius: 8px;
            padding: 8px 10px;
        }
        .prep-submit {
            border: 0;
            border-radius: 8px;
            padding: 11px 12px;
            font: inherit;
            font-weight: 800;
            color: #fff;
            background: #5BB805;
            cursor: pointer;
        }
        @media (max-width: 720px) {
            .prep-hero { object-position: center 38%; }
        }
    </style>
    {% if meta_pixel_id %}
    <script data-cfasync="false">
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '{{ meta_pixel_id }}');
    fbq('track', 'PageView');
    </script>
    {% endif %}
</head>
<body>
    <img
        class="prep-hero"
        src="{% static 'img/site-prep.jpg' %}"
        alt="Trenutno radimo na poboljšanju vašeg iskustva — opremazaribolov.ba"
        width="1536"
        height="1024"
    >
    <details class="prep-staff"{% if error %} open{% endif %}>
        <summary>Pristup za tim</summary>
        <form method="post" class="prep-form">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next_url }}">
            {% if error %}
            <div class="prep-error" role="alert">{{ error }}</div>
            {% endif %}
            <input
                type="password"
                name="lozinka"
                autocomplete="current-password"
                required
                placeholder="Lozinka"
                {% if error %}autofocus{% endif %}
                aria-label="Lozinka"
            >
            <button type="submit" class="prep-submit">Ulaz na sajt</button>
        </form>
    </details>
</body>
</html>
