<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pakovanje #{{ order.broj }}</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f3f4f6;
            font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: #111;
            line-height: 1.4;
        }
        .print-toolbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            max-width: 900px;
            margin: 0 auto 16px;
            padding: 12px 14px;
            background: #fff;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
        }
        .print-toolbar p {
            margin: 0;
            font-size: 14px;
            color: #374151;
        }
        .print-toolbar-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .print-toolbar a,
        .print-toolbar button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 8px 14px;
            border-radius: 8px;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-print {
            border: none;
            background: #111;
            color: #fff;
        }
        .btn-back {
            border: 1px solid #d1d5db;
            background: #fff;
            color: #111;
        }
        .packing-section {
            max-width: 900px;
            margin: 0 auto;
        }
        .packing-sheet {
            padding: 22px 24px 28px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }
        .packing-head {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 12px 24px;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 2px solid #111;
        }
        .packing-title {
            margin: 0 0 6px;
            font-size: 22px;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }
        .packing-subtitle {
            margin: 0;
            font-size: 13px;
            color: #444;
        }
        .packing-meta {
            text-align: right;
            font-size: 13px;
        }
        .packing-meta strong {
            display: block;
            font-size: 18px;
            margin-bottom: 4px;
        }
        .packing-customer {
            margin: 0 0 16px;
            font-size: 13px;
            color: #333;
        }
        .packing-alert {
            margin: 0 0 14px;
            padding: 10px 12px;
            border-radius: 6px;
            background: #fef3c7;
            border: 1px solid #f59e0b;
            font-size: 13px;
            color: #78350f;
        }
        .pack-table {
            width: 100%;
            border-collapse: collapse;
        }
        .pack-table th,
        .pack-table td {
            border: 1px solid #999;
            padding: 6px 7px;
            vertical-align: middle;
            font-size: 13px;
            font-weight: 400;
            background: none;
        }
        .pack-table th {
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 400;
        }
        .pack-table .col-rb {
            width: 28px;
            text-align: center;
        }
        .pack-table .col-qty {
            width: 56px;
            text-align: center;
            font-weight: 400;
            white-space: nowrap;
        }
        .pack-table .item-name {
            font-weight: 400;
            color: #111;
        }
        .pack-table .item-sifra {
            display: block;
            margin-top: 2px;
            font-size: 11px;
        }
        .pack-table .pk-loc {
            font-weight: 700;
        }
        .packing-hint {
            margin: 16px 0 0;
            font-size: 11px;
            color: #666;
        }

        @page {
            size: A4 portrait;
            margin: 10mm;
        }

        @media print {
            body {
                background: #fff;
                padding: 0;
            }
            .print-toolbar {
                display: none !important;
            }
            .packing-section {
                max-width: none;
                margin: 0;
            }
            .packing-sheet {
                padding: 0;
                border: none;
                border-radius: 0;
            }
            .pack-table th,
            .pack-table td {
                background: none;
            }
        }
    </style>
</head>
<body>
    <div class="print-toolbar">
        <p><strong>Pakovanje #{{ order.broj }}</strong> — artikli + Odoo lokacije (abecedno)</p>
        <div class="print-toolbar-actions">
            <a class="btn-back" href="{% url 'staff_magacin_narudzbe' %}">← Magacin narudžbe</a>
            <a class="btn-back" href="{% url 'staff_order_detail' broj=order.broj %}">Pregled računa</a>
            <button type="button" class="btn-print" id="printPackingBtn">Štampaj</button>
        </div>
    </div>

    {% include 'partials/order_packing_document.html' %}

    <script>
    (function () {
        var btn = document.getElementById('printPackingBtn');
        if (btn) {
            btn.addEventListener('click', function () { window.print(); });
        }
        window.addEventListener('load', function () {
            window.setTimeout(function () { window.print(); }, 250);
        });
    })();
    </script>
</body>
</html>
