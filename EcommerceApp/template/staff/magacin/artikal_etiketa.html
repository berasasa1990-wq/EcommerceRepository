<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="utf-8">
    <title>Etiketa {{ sifra|default:naziv }}</title>
    <style>
        @page { size: 60mm 40mm; margin: 0; }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            background: #fff;
            color: #000;
        }
        .bar {
            padding: 12px 16px;
            font: 14px/1.3 Arial, Helvetica, sans-serif;
        }
        .bar button {
            min-height: 40px;
            padding: 0 16px;
        }
        .sheet { padding: 16px; }
        .label {
            width: 60mm;
            height: 40mm;
            padding: 1.8mm 2.4mm 1.4mm;
            border: 0.45mm solid #111;
            border-radius: 2.4mm;
            display: flex;
            flex-direction: column;
            font-family: Arial, Helvetica, sans-serif;
            color: #111;
            overflow: hidden;
            background: #fff;
        }
        .naziv {
            margin: 0;
            flex: 0 0 auto;
            font-size: 3.35mm;
            font-weight: 800;
            line-height: 1.12;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            overflow: hidden;
            overflow-wrap: anywhere;
            word-break: break-word;
            max-height: 7.5mm;
        }
        .rule {
            height: 0;
            margin: 0.85mm 0 0.7mm;
            border: 0;
            border-top: 0.32mm solid #111;
            flex-shrink: 0;
        }
        .sifra {
            margin: 0 0 0.45mm;
            font-size: 2.15mm;
            font-weight: 700;
            letter-spacing: .04em;
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .barcode {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 7.5mm;
        }
        .barcode img {
            display: block;
            width: 100%;
            height: 8.8mm;
            max-height: 9.2mm;
            object-fit: fill;
            object-position: center;
        }
        .barcode span {
            display: block;
            margin-top: 0.25mm;
            font-size: 2.35mm;
            font-family: Arial, Helvetica, sans-serif;
            letter-spacing: .08em;
            font-weight: 700;
            flex-shrink: 0;
        }
        .cijena-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 2mm;
            flex-shrink: 0;
            margin-top: 0.4mm;
            padding-top: 0.55mm;
            border-top: 0.32mm solid #111;
        }
        .cijena-iznos {
            font-size: 8.4mm;
            font-weight: 800;
            letter-spacing: -0.06em;
            line-height: 0.88;
            white-space: nowrap;
        }
        .cijena-km {
            font-size: 4.9mm;
            font-weight: 800;
            letter-spacing: .02em;
            line-height: 1;
        }
        @media print {
            .bar { display: none !important; }
            .sheet { padding: 0; }
            html, body, .label {
                width: 60mm;
                height: 40mm;
                background: #fff;
            }
            .label { border-radius: 2.2mm; }
        }
    </style>
</head>
<body>
    <div class="bar">
        <button type="button" onclick="window.print()">Štampaj</button>
        <span>Etiketa 60 × 40 mm</span>
    </div>
    <div class="sheet">
        <article class="label">
            <h1 class="naziv">{{ naziv }}</h1>
            <hr class="rule">
            <p class="sifra">ŠIFRA: {% if sifra %}{{ sifra }}{% else %}—{% endif %}</p>
            <div class="barcode">
                {% if barcode_src %}
                <img src="{{ barcode_src }}" alt="{{ barkod }}">
                {% endif %}
                {% if barkod %}<span>{{ barkod }}</span>{% endif %}
            </div>
            <div class="cijena-row">
                {% if cijena_label %}
                <span class="cijena-iznos">{{ cijena_label }}</span>
                <span class="cijena-km">KM</span>
                {% else %}
                <span class="cijena-iznos">—</span>
                {% endif %}
            </div>
        </article>
    </div>
    <script>window.addEventListener('load', function () { window.print(); });</script>
</body>
</html>
