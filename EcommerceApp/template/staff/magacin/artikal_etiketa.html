<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="utf-8">
    <title>Etiketa {{ sifra|default:naziv }}</title>
    <style>
        @page { size: 3.559in 1.224in; margin: 0; }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            background: #fff;
            color: #000;
        }
        .bar {
            padding: 12px 16px;
            font: 14px/1.3 Arial, Helvetica, sans-serif;
        }
        .bar button {
            min-height: 40px;
            padding: 0 16px;
        }
        .sheet {
            padding: 16px;
        }
        .label {
            width: 3.559in;
            height: 1.224in;
            padding: 0.07in 0.1in 0.05in;
            border: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            font-family: Arial, Helvetica, sans-serif;
            color: #000;
            overflow: hidden;
            background: #fff;
        }
        .top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.08in;
            flex-shrink: 0;
        }
        .info {
            min-width: 0;
            flex: 1 1 auto;
        }
        .naziv {
            margin: 0;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.12;
            text-transform: uppercase;
            max-height: 2.3em;
            overflow: hidden;
        }
        .sifra {
            margin: 0.02in 0 0;
            font-size: 8px;
            letter-spacing: .03em;
        }
        .cijena {
            margin: 0;
            flex-shrink: 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -.02em;
            line-height: 1;
            white-space: nowrap;
            text-align: right;
        }
        .barcode {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 0;
            padding-top: 0.04in;
        }
        .barcode img {
            display: block;
            width: 100%;
            height: 0.58in;
            object-fit: contain;
            object-position: center;
        }
        .barcode span {
            display: block;
            margin-top: 0.03in;
            font-size: 9px;
            font-family: ui-monospace, Consolas, "Courier New", monospace;
            letter-spacing: .12em;
            font-weight: 700;
        }
        @media print {
            .bar { display: none !important; }
            .sheet { padding: 0; }
            html, body, .label {
                width: 3.559in;
                height: 1.224in;
                background: #fff;
            }
            .label { border: 0; padding: 0.06in 0.08in 0.04in; }
        }
    </style>
</head>
<body>
    <div class="bar">
        <button type="button" onclick="window.print()">Štampaj</button>
        <span>Etiketa 3.559 × 1.224 in</span>
    </div>
    <div class="sheet">
        <article class="label">
            <header class="top">
                <div class="info">
                    <h1 class="naziv">{{ naziv }}</h1>
                    <p class="sifra">{% if sifra %}{{ sifra }}{% else %}—{% endif %}</p>
                </div>
                <p class="cijena">{% if cijena is not None %}{{ cijena }} KM{% else %}—{% endif %}</p>
            </header>
            <div class="barcode">
                {% if barcode_src %}
                <img src="{{ barcode_src }}" alt="{{ barkod }}">
                {% endif %}
                {% if barkod %}<span>{{ barkod }}</span>{% endif %}
            </div>
        </article>
    </div>
    <script>window.addEventListener('load', function () { window.print(); });</script>
</body>
</html>
