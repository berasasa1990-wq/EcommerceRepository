<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="utf-8">
    <title>Etiketa {{ sifra|default:naziv }}</title>
    <style>
        @page { size: 6cm 4cm; margin: 0; }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            background: #fff;
            color: #000;
        }
        .bar {
            padding: 12px 16px;
            font: 14px/1.3 Arial, Helvetica, sans-serif;
        }
        .bar button {
            min-height: 40px;
            padding: 0 16px;
        }
        .sheet {
            padding: 16px;
        }
        .label {
            width: 6cm;
            height: 4cm;
            padding: 2.4mm 3mm 2mm;
            border: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            font-family: Arial, Helvetica, sans-serif;
            color: #000;
            overflow: hidden;
            background: #fff;
        }
        .naziv {
            margin: 0;
            font-size: 10px;
            font-weight: 700;
            line-height: 1.15;
            max-height: 2.3em;
            overflow: hidden;
        }
        .sifra {
            margin: 1mm 0 0;
            font-size: 8px;
            letter-spacing: .02em;
        }
        .barcode {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 0;
            margin: 1.2mm 0 1mm;
        }
        .barcode img {
            display: block;
            width: 100%;
            height: 12mm;
            object-fit: contain;
            object-position: center;
        }
        .barcode span {
            display: block;
            margin-top: 0.6mm;
            font-size: 8px;
            font-family: ui-monospace, Consolas, "Courier New", monospace;
            letter-spacing: .08em;
            font-weight: 700;
        }
        .cijena {
            margin: 0;
            font-size: 16px;
            font-weight: 800;
            text-align: right;
            line-height: 1;
            white-space: nowrap;
        }
        @media print {
            .bar { display: none !important; }
            .sheet { padding: 0; }
            html, body {
                width: 6cm;
                height: 4cm;
                background: #fff;
            }
            .label { border: 0; }
        }
    </style>
</head>
<body>
    <div class="bar">
        <button type="button" onclick="window.print()">Štampaj</button>
        <span>Etiketa 6 × 4 cm</span>
    </div>
    <div class="sheet">
        <article class="label">
            <h1 class="naziv">{{ naziv }}</h1>
            <p class="sifra">{% if sifra %}{{ sifra }}{% else %}—{% endif %}</p>
            <div class="barcode">
                {% if barcode_src %}
                <img src="{{ barcode_src }}" alt="{{ barkod }}">
                {% endif %}
                {% if barkod %}<span>{{ barkod }}</span>{% endif %}
            </div>
            <p class="cijena">{% if cijena is not None %}{{ cijena }} KM{% else %}—{% endif %}</p>
        </article>
    </div>
    <script>window.addEventListener('load', function () { window.print(); });</script>
</body>
</html>
