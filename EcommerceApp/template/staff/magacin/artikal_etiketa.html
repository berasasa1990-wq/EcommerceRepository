<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="utf-8">
    <title> </title>
    <style>
        @page { size: 60mm 40mm; margin: 0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            margin: 0;
            padding: 0;
            background: #fff;
            color: #111;
        }
        .bar {
            padding: 12px 16px;
            font: 14px/1.3 Arial, Helvetica, sans-serif;
        }
        .bar button {
            min-height: 40px;
            padding: 0 16px;
        }
        .sheet { padding: 16px; }
        .label {
            width: 60mm;
            height: 40mm;
            max-width: 60mm;
            max-height: 40mm;
            padding: 1.5mm 2.1mm 1.2mm;
            border: 0.35mm solid #111;
            border-radius: 2mm;
            display: flex;
            flex-direction: column;
            font-family: Arial, Helvetica, sans-serif;
            color: #111;
            overflow: hidden;
            background: #fff;
        }
        .naziv {
            flex: 0 0 auto;
            font-size: 2.95mm;
            font-weight: 800;
            line-height: 1.12;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            overflow: hidden;
            overflow-wrap: anywhere;
            word-break: break-word;
            max-height: 6.6mm;
        }
        .rule {
            flex-shrink: 0;
            height: 0.3mm;
            margin: 0.7mm 0 0.55mm;
            background: #111;
            border: 0;
        }
        .sifra {
            flex-shrink: 0;
            margin: 0 0 0.4mm;
            font-size: 2mm;
            font-weight: 700;
            letter-spacing: .04em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .barcode {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 0;
            overflow: hidden;
        }
        .barcode img {
            display: block;
            width: 100%;
            height: 7.6mm;
            max-height: 8mm;
            object-fit: fill;
            object-position: center;
        }
        .barcode span {
            display: block;
            margin-top: 0.2mm;
            font-size: 2.1mm;
            letter-spacing: .07em;
            font-weight: 700;
        }
        .cijena-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1.5mm;
            flex-shrink: 0;
            margin-top: 0.35mm;
            padding-top: 0.45mm;
            border-top: 0.3mm solid #111;
        }
        .cijena-iznos {
            font-size: 7.2mm;
            font-weight: 800;
            letter-spacing: -0.06em;
            line-height: 0.9;
            white-space: nowrap;
        }
        .cijena-km {
            font-size: 4.2mm;
            font-weight: 800;
            letter-spacing: .02em;
            line-height: 1;
        }
        @media print {
            html, body {
                width: 60mm !important;
                height: 40mm !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: hidden !important;
            }
            .bar { display: none !important; }
            .sheet {
                padding: 0 !important;
                margin: 0 !important;
                width: 60mm !important;
                height: 40mm !important;
                overflow: hidden !important;
            }
            .label {
                position: fixed;
                top: 0;
                left: 0;
                width: 60mm !important;
                height: 40mm !important;
                max-width: 60mm !important;
                max-height: 40mm !important;
                overflow: hidden !important;
                page-break-after: avoid !important;
                page-break-inside: avoid !important;
                break-after: avoid !important;
                break-inside: avoid !important;
            }
        }
    </style>
</head>
<body>
    <div class="bar">
        <button type="button" onclick="window.print()">Štampaj</button>
        <span>Etiketa 60 × 40 mm — u printeru: papir 60×40 mm, bez zaglavlja, skala 100%</span>
    </div>
    <div class="sheet">
        <article class="label">
            <h1 class="naziv">{{ naziv }}</h1>
            <div class="rule"></div>
            <p class="sifra">ŠIFRA: {% if sifra %}{{ sifra }}{% else %}—{% endif %}</p>
            <div class="barcode">
                {% if barcode_src %}
                <img src="{{ barcode_src }}" alt="{{ barkod }}">
                {% endif %}
                {% if barkod %}<span>{{ barkod }}</span>{% endif %}
            </div>
            <div class="cijena-row">
                {% if cijena_label %}
                <span class="cijena-iznos">{{ cijena_label }}</span>
                <span class="cijena-km">KM</span>
                {% else %}
                <span class="cijena-iznos">—</span>
                {% endif %}
            </div>
        </article>
    </div>
    <script>
    window.addEventListener('load', function () {
        document.title = ' ';
        window.print();
    });
    </script>
</body>
</html>
