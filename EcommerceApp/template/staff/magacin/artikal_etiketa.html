<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="utf-8">
    <title> </title>
    <style>
        @page { size: 32mm 57mm; margin: 0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            margin: 0;
            padding: 0;
            background: #fff;
            color: #111;
        }
        .bar {
            padding: 12px 16px;
            font: 14px/1.3 Arial, Helvetica, sans-serif;
        }
        .bar button {
            min-height: 40px;
            padding: 0 16px;
            margin-right: 8px;
        }
        .sheet { padding: 16px; }
        .label {
            display: block;
            width: 32mm;
            height: 57mm;
            image-rendering: pixelated;
        }
        .meta { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
        @media print {
            html, body {
                width: 32mm !important;
                height: 57mm !important;
                max-width: 32mm !important;
                max-height: 57mm !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: hidden !important;
                background: #fff !important;
            }
            .bar, .meta { display: none !important; }
            .sheet {
                padding: 0 !important;
                margin: 0 !important;
                width: 32mm !important;
                height: 57mm !important;
                overflow: hidden !important;
            }
            .label {
                width: 32mm !important;
                height: 57mm !important;
                max-width: 32mm !important;
                max-height: 57mm !important;
                page-break-after: avoid !important;
                page-break-inside: avoid !important;
            }
        }
    </style>
</head>
<body>
    <div class="bar">
        <button type="button" onclick="printEtiketa()">Štampaj</button>
        <span>Zebra ZD421 — papir 32 × 57 mm, Portrait, 203 dpi, 1 kopija, 100%, margine 0</span>
    </div>
    <div class="sheet">
        {% if label_src %}
        <img class="label" src="{{ label_src }}" alt="{{ naziv }} {{ cijena_label }} KM">
        {% endif %}
    </div>
    <div class="meta">
        {{ naziv }}
        ŠIFRA: {% if sifra %}{{ sifra }}{% else %}—{% endif %}
        {% if barkod %}{{ barkod }}{% endif %}
        {% if cijena_label %}{{ cijena_label }}{% endif %}
        <span class="cijena-km">KM</span>
        {% if barcode_src %}<img src="{{ barcode_src }}" alt="">{% endif %}
    </div>
    <script type="application/zpl" id="etiketa-zpl">{{ zpl|safe }}</script>
    <script>
    function fallbackPrint() {
        document.title = ' ';
        window.print();
    }
    function printEtiketa() {
        var zplEl = document.getElementById('etiketa-zpl');
        var zpl = zplEl ? zplEl.textContent : '';
        if (zpl && window.BrowserPrint) {
            try {
                window.BrowserPrint.getDefaultDevice('printer', function (device) {
                    if (!device) { fallbackPrint(); return; }
                    device.send(zpl, function () {}, function () { fallbackPrint(); });
                }, function () { fallbackPrint(); });
                return;
            } catch (err) {}
        }
        fallbackPrint();
    }
    window.addEventListener('load', function () {
        setTimeout(printEtiketa, 400);
    });
    </script>
    <script src="http://127.0.0.1:9100/default" async></script>
</body>
</html>
