<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="utf-8">
    <title>Etiketa {{ sifra|default:naziv }}</title>
    <style>
        @page { size: 3.559in 1.224in; margin: 0; }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            background: #fff;
            color: #000;
        }
        .bar {
            padding: 12px 16px;
            font: 14px/1.3 Arial, Helvetica, sans-serif;
        }
        .bar button {
            min-height: 40px;
            padding: 0 16px;
        }
        .sheet {
            padding: 16px;
        }
        .label {
            width: 3.559in;
            height: 1.224in;
            padding: 1.5mm 2.2mm 1.4mm;
            border: 1px solid #ccc;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            grid-template-rows: auto auto minmax(0, 1fr);
            column-gap: 2.4mm;
            row-gap: 0.4mm;
            font-family: Arial, Helvetica, sans-serif;
            color: #000;
            overflow: hidden;
            background: #fff;
        }
        .naziv {
            grid-column: 1 / -1;
            margin: 0;
            font-size: 9px;
            font-weight: 700;
            line-height: 1.15;
            max-height: 2.3em;
            overflow: hidden;
        }
        .sifra {
            grid-column: 1 / -1;
            margin: 0;
            font-size: 7.5px;
            letter-spacing: .02em;
        }
        .barcode {
            grid-column: 1;
            grid-row: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 0;
            min-height: 0;
        }
        .barcode img {
            display: block;
            width: 100%;
            height: 8.5mm;
            object-fit: contain;
            object-position: center;
        }
        .barcode span {
            display: block;
            margin-top: 0.4mm;
            font-size: 7.5px;
            font-family: ui-monospace, Consolas, "Courier New", monospace;
            letter-spacing: .08em;
            font-weight: 700;
        }
        .cijena {
            grid-column: 2;
            grid-row: 3;
            margin: 0;
            align-self: center;
            font-size: 18px;
            font-weight: 800;
            text-align: right;
            line-height: 1;
            white-space: nowrap;
        }
        @media print {
            .bar { display: none !important; }
            .sheet { padding: 0; }
            html, body {
                width: 3.559in;
                height: 1.224in;
                background: #fff;
            }
            .label { border: 0; }
        }
    </style>
</head>
<body>
    <div class="bar">
        <button type="button" onclick="window.print()">Štampaj</button>
        <span>Etiketa 3.559 × 1.224 in</span>
    </div>
    <div class="sheet">
        <article class="label">
            <h1 class="naziv">{{ naziv }}</h1>
            <p class="sifra">{% if sifra %}{{ sifra }}{% else %}—{% endif %}</p>
            <div class="barcode">
                {% if barcode_src %}
                <img src="{{ barcode_src }}" alt="{{ barkod }}">
                {% endif %}
                {% if barkod %}<span>{{ barkod }}</span>{% endif %}
            </div>
            <p class="cijena">{% if cijena is not None %}{{ cijena }} KM{% else %}—{% endif %}</p>
        </article>
    </div>
    <script>window.addEventListener('load', function () { window.print(); });</script>
</body>
</html>
