<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="utf-8">
    <title>Zebra barkod</title>
    <style>
        @page {
            size: {{ label_width }}in {{ label_height }}in;
            margin: 0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            margin: 0;
            padding: 0;
            background: #e8ece6;
            color: #111;
        }
        .bar {
            max-width: 520px;
            margin: 12px auto;
            padding: 12px 16px;
            background: #fff;
            border: 1px solid #d1d5db;
            font: 13px/1.4 Arial, Helvetica, sans-serif;
        }
        .bar button {
            min-height: 40px;
            padding: 0 16px;
            border: 0;
            background: #111;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
        .bar p { margin: 8px 0 0; color: #4b5563; }
        .label {
            width: {{ label_width }}in;
            height: {{ label_height }}in;
            margin: 12px auto;
            padding: {{ label_top }}in 0.08in 0.04in 0;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }
        .label .barcode {
            flex: 1 1 auto;
            width: 100%;
            display: flex;
            align-items: stretch;
            justify-content: center;
            min-height: 0;
        }
        .label img {
            display: block;
            width: 100%;
            height: 0.78in;
            object-fit: contain;
            object-position: center;
        }
        .label .digits {
            flex: 0 0 auto;
            margin-top: 0.03in;
            font-size: 11pt;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-align: center;
        }
        .empty {
            max-width: 520px;
            margin: 24px auto;
            padding: 16px;
            background: #fff;
            font: 14px Arial, Helvetica, sans-serif;
        }
        @media print {
            html, body {
                background: #fff;
                width: {{ label_width }}in;
                height: {{ label_height }}in;
            }
            .bar, .empty { display: none !important; }
            .label {
                margin: 0 !important;
                page-break-after: avoid;
            }
        }
    </style>
</head>
<body>
    {% if barkod %}
    <div class="bar">
        <button type="button" onclick="window.print()">Štampaj na Zebra</button>
        <p>Zebra · 3,559" × 1,224" · Label with gaps · rotacija 0 · top 0,1" · left 0"</p>
    </div>
    <article class="label">
        <div class="barcode">
            {% if barcode_src %}
            <img src="{{ barcode_src }}" alt="{{ barkod }}">
            {% endif %}
        </div>
        <span class="digits">{{ barkod }}</span>
    </article>
    <script>
    (function () {
        var zpl = "{{ zpl|escapejs }}";
        function doPrint() {
            if (typeof BrowserPrint === 'undefined') {
                window.print();
                return;
            }
            BrowserPrint.getDefaultDevice('printer', function (device) {
                if (!device || !zpl) {
                    window.print();
                    return;
                }
                device.send(zpl, function () {}, function () { window.print(); });
            }, function () { window.print(); });
        }
        window.addEventListener('load', function () {
            document.title = ' ';
            doPrint();
        });
    })();
    </script>
    {% else %}
    <p class="empty">Nema barkoda za ovaj artikal.</p>
    {% endif %}
</body>
</html>
