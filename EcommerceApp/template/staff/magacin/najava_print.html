<!doctype html><html lang="bs"><head><meta charset="utf-8"><title>Najava pošiljaka</title><style>body{font:14px Arial,sans-serif;color:#172b4c;padding:24px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #cbd5e1;padding:10px;text-align:left}th{background:#edf7ff}button{padding:10px 20px;border:0;border-radius:8px;background:#008bb9;color:#fff}@media print{button{display:none}body{padding:0}thead{display:table-header-group}tr{break-inside:avoid}}</style></head><body><button onclick="window.print()">Štampaj</button><h1>Najava pošiljaka</h1><p>{{ print_day }}</p><table><thead><tr><th>Narudžba</th><th>Kupac</th><th>Telefon</th><th>Adresa</th><th>Grad</th><th>Iznos</th></tr></thead><tbody>{% for order in orders %}<tr><td>#{{ order.broj }}</td><td>{{ order.ime_prezime }}</td><td>{{ order.telefon }}</td><td>{{ order.adresa }}</td><td>{{ order.postanski_broj }} {{ order.grad }}</td><td>{{ order.ukupno }} KM</td></tr>{% empty %}<tr><td colspan="6">Nema narudžbi za odabrani datum.</td></tr>{% endfor %}</tbody></table></body></html>
