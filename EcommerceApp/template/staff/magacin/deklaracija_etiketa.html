<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="utf-8">
    <title> </title>
    <style>
        @page { size: A4 portrait; margin: 0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            margin: 0;
            padding: 0;
            background: #e8ece6;
            color: #111;
        }
        .bar {
            max-width: 210mm;
            margin: 12px auto;
            padding: 12px 16px;
            background: #fff;
            border: 1px solid #d1d5db;
            font: 14px/1.3 Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .bar button {
            min-height: 40px;
            padding: 0 16px;
            border: 0;
            background: #111;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
        .sheet {
            width: 210mm;
            height: 297mm;
            margin: 0 auto 16px;
            padding: 10.7mm 10mm;
            background: #fff;
            display: grid;
            grid-template-columns: repeat(5, 38mm);
            grid-template-rows: repeat(13, 21.2mm);
            column-gap: 0;
            row-gap: 0;
            align-content: start;
            justify-content: start;
        }
        .label {
            width: 38mm;
            height: 21.2mm;
            min-width: 0;
            min-height: 0;
            padding: 0.7mm 0.9mm;
            overflow: hidden;
            page-break-inside: avoid;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 5.2pt;
            line-height: 1.08;
            letter-spacing: -0.02em;
            color: #111;
        }
        .row {
            display: grid;
            grid-template-columns: max-content minmax(0, 1fr);
            column-gap: 0.7mm;
            min-width: 0;
        }
        .row b {
            font-weight: 800;
            white-space: nowrap;
        }
        .row span {
            min-width: 0;
            overflow: hidden;
            font-weight: 700;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        @media print {
            html, body {
                margin: 0 !important;
                padding: 0 !important;
                background: #fff !important;
            }
            .bar { display: none !important; }
            .sheet {
                width: 210mm !important;
                height: 297mm !important;
                min-height: 0 !important;
                margin: 0 !important;
                padding: 10.7mm 10mm !important;
                overflow: hidden;
                page-break-after: always;
                break-after: page;
            }
            .sheet:last-child {
                page-break-after: auto;
                break-after: auto;
            }
        }
    </style>
</head>
<body>
    <div class="bar">
        <button type="button" onclick="window.print()">Štampaj</button>
        <span>Tip Top Office — A4 210 × 297 mm, 65 deklaracija 38 × 21,2 mm (5 × 13). Skala 100%, margine nijedne, bez sječenja.</span>
    </div>
    {% for sheet in sheets %}
    <div class="sheet">
        {% for _slot in sheet %}
        <article class="label">
            {% for red in deklaracija_redovi %}
            <div class="row"><b>{{ red.label }}:</b><span>{{ red.value }}</span></div>
            {% endfor %}
        </article>
        {% endfor %}
    </div>
    {% endfor %}
    <script>
    window.addEventListener('load', function () {
        document.title = ' ';
        var labels = document.querySelectorAll('.label');
        if (labels.length) {
            var probe = labels[0];
            var size = 5.6;
            probe.style.fontSize = size + 'pt';
            while (size > 3.6 && probe.scrollHeight > probe.clientHeight + 0.5) {
                size -= 0.1;
                probe.style.fontSize = size + 'pt';
            }
            var fitted = probe.style.fontSize;
            for (var i = 1; i < labels.length; i++) labels[i].style.fontSize = fitted;
        }
        window.print();
    });
    </script>
</body>
</html>
