{% extends 'staff/magacin/base.html' %}

{% block magacin_content %}
<div class="pk-app pk-scan-only" id="pkListApp">
    <header class="pk-bar">
        <a class="pk-bar-back" href="{% url 'staff_magacin_narudzbe' %}">←</a>
        <div class="pk-bar-title">
            <strong>Picking</strong>
            <span>Skeniraj narudžbu</span>
        </div>
    </header>
    <div class="pk-scan-home">
        <input type="text" id="pkListSearch" class="pk-scan-hidden" inputmode="none" autocomplete="off" autofocus data-scan-url="{% url 'staff_magacin_pakuj_sken' %}" aria-label="Barkod narudžbe">
        <button type="button" class="pk-cam pk-cam-xl" id="pkOrderScan" data-mg-scan-target="pkListSearch" data-mg-scan-title="Skeniraj narudžbu" data-mg-scan-auto="1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v5M16 8v8"/></svg>
            Skeniraj narudžbu
        </button>
    </div>
</div>
{% endblock %}
