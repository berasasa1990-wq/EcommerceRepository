{% extends "base.html" %}
{% block content %}
<main class="container" style="max-width:520px;padding:48px 16px">
  <h1>Nova lozinka</h1>
  {% if validlink %}
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sačuvaj novu lozinku</button>
  </form>
  {% else %}<p>Link nije važeći ili je već iskorišten.</p>{% endif %}
</main>
{% endblock %}
