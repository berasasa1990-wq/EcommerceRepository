{% if product_urgency %}
<div class="product-urgency" aria-live="polite">
    <p class="product-urgency-sold">
        <span class="product-urgency-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                <line x1="3" y1="6" x2="21" y2="6"/>
                <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
        </span>
        <span>
            🔥 <strong>{{ product_urgency.sold_24h }}</strong>
            {% if product_urgency.sold_24h == 1 %}kupac je uzeo{% else %}kupaca je uzelo{% endif %}
            ovo u proteklih 24h
        </span>
    </p>
</div>
{% endif %}
